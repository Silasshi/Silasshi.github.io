          - "**COSMOS:** a benchmark for visually grounded scientific reasoning. I proposed *Visual Deduction*, which modifies one scientific law and edits a real image to show its consequence; across nineteen VLMs, most wrong answers on counterfactual images fall back on the real-world answer."
