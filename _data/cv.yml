          - "**Training LLMs for Scientific Research Planning** ([code](https://github.com/Silasshi/co-scientist-rl)): reproduced ResearchPlanGen with a continuous rubric reward, and implemented GRPO, evolving rubrics, SDPO and TTT-Discover."

